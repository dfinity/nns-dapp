# Local test network for development and CI.
#
# The network launcher starts PocketIC with the NNS, the SNS, Internet Identity,
# the ICP ledger, the SNS aggregator and an nns-dapp. The NNS root canister
# controls those canisters. `scripts/icp-network-start` adds the current icp
# identity as a controller, so a local build can replace the nns-dapp and the
# aggregator.
#
# Mainnet wasms come from `scripts/docker-build`. Releases go through NNS
# proposals, see `scripts/nns-dapp/release-sop`.
networks:
  - name: local
    mode: managed
    version: v16.1.0-2026-10-16-03-29
    gateway:
      port: 8080
    nns: true
    # The same delay on update calls as dfx had by default. Without it, some
    # end-to-end tests read a state before the index canister has synced.
    artificial-delay-ms: 600
canisters:
  - name: nns-dapp
    build:
      steps:
        - type: pre-built
          path: nns-dapp.wasm.gz
  - name: sns_aggregator
    build:
      steps:
        - type: pre-built
          path: sns_aggregator.wasm.gz
  # A mock of the ICP Swap price feed. The asset canister serves mocks/icp-swap/tickers.
  - name: icp-swap
    recipe:
      type: "@dfinity/asset-canister@v2.3.0"
      configuration:
        version: "0.32.0"
        dir: mocks/icp-swap
  # A test ICRC token for the import token tests, see mocks/ckred. The wasms
  # come from the IC commit in config.json, IC_COMMIT_FOR_SNS_AGGREGATOR.
  - name: ckred_ledger
    build:
      steps:
        - type: pre-built
          url: https://download.dfinity.systems/ic/f54e1f82c3cf8ae0b4be6b0fc3a940cdcd70dd97/canisters/ic-icrc1-ledger-u256.wasm.gz
          sha256: 7905265687205b49eb625a242cf7dbac0ff7dc0f0b42d3d4c26b40bc4d566b1c
  - name: ckred_index
    build:
      steps:
        - type: pre-built
          url: https://download.dfinity.systems/ic/f54e1f82c3cf8ae0b4be6b0fc3a940cdcd70dd97/canisters/ic-icrc1-index-ng-u256.wasm.gz
          sha256: 8a0e1189339009dbd5c70fc4310ed4f2a07bac9730aa25f036724e1611fecd5b
  # A mock of the exchange rate canister, with the mainnet canister ID. The
  # nns-dapp reads the ICP price from it for the total value locked.
  - name: xrc
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/exchange-rate-canister/releases/download/2024.09.05/xrc_mock.wasm.gz
          sha256: 520744bf7f60665722f597c172abebf53be300d66ed0cb87744663567949a1b1
environments:
  - name: local
    network: local
    canisters: [nns-dapp, sns_aggregator, icp-swap, ckred_ledger, ckred_index, xrc]
  # Mainnet, for read-only queries. The canister IDs are in .icp/data/mappings/ic.ids.json.
  - name: ic
    network: ic
    canisters: [nns-dapp, sns_aggregator]
